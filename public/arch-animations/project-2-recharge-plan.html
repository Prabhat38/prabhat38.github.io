<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Recharge Plan Service — Architecture</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#02020f;overflow:hidden;font-family:'Segoe UI',sans-serif;}
  #flow-menu{position:fixed;left:0;top:0;bottom:0;width:220px;background:rgba(2,4,20,.92);border-right:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;padding:24px 0 16px;z-index:100;backdrop-filter:blur(8px);}
  .menu-hdr{color:rgba(255,255,255,.38);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:0 18px 18px;}
  .flow-btn{display:flex;align-items:flex-start;gap:10px;padding:12px 18px;cursor:pointer;border-left:3px solid transparent;transition:background .2s,border-color .2s;}
  .flow-btn:hover{background:rgba(255,255,255,.05);}
  .flow-btn.active{background:rgba(255,255,255,.07);border-left-color:currentColor;}
  .flow-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px;}
  .flow-name{color:#eee;font-size:13px;font-weight:600;line-height:1.3;}
  .flow-desc{color:rgba(255,255,255,.38);font-size:10.5px;margin-top:2px;line-height:1.4;}
  #canvas-wrap{position:fixed;left:220px;top:0;width:calc(100% - 220px);height:100%;}
  #canvas-wrap canvas{width:100%!important;height:100%!important;display:block;}
  #proj-title{position:fixed;top:18px;left:240px;z-index:50;color:rgba(255,255,255,.7);font-size:13px;letter-spacing:.06em;pointer-events:none;}
  #proj-title span{color:rgba(255,255,255,.28);margin-right:8px;}
  .lbl{position:absolute;pointer-events:none;transform:translate(-50%,0);text-align:center;background:rgba(2,2,16,.75);padding:3px 8px;border-radius:4px;line-height:1.35;}
  .lbl-main{color:#fff;font-size:11px;font-weight:700;letter-spacing:.04em;}
  .lbl-sub{color:rgba(255,255,255,.48);font-size:9px;}
</style>
</head>
<body>
<div id="flow-menu">
  <div class="menu-hdr">Request Flows</div>
  <div class="flow-btn active" data-flow="plan-listing" style="color:#44aaff">
    <div class="flow-dot" style="background:#44aaff"></div>
    <div><div class="flow-name">Plan Listing</div><div class="flow-desc">Dual cache · circuit breaker · merge</div></div>
  </div>
  <div class="flow-btn" data-flow="plan-search" style="color:#77ee33">
    <div class="flow-dot" style="background:#77ee33"></div>
    <div><div class="flow-name">Plan Search</div><div class="flow-desc">Parallel ES + Catalog · partial results</div></div>
  </div>
  <div class="flow-btn" data-flow="es-lifecycle" style="color:#ffcc00">
    <div class="flow-dot" style="background:#ffcc00"></div>
    <div><div class="flow-name">ES Index Lifecycle</div><div class="flow-desc">Cron · delete indexes older than 3 days</div></div>
  </div>
</div>
<div id="proj-title"><span>PROJECT 2</span>Recharge Plan Service</div>
<div id="canvas-wrap">
  <div id="lc" style="position:absolute;inset:0;pointer-events:none;z-index:10;overflow:hidden;"></div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { Timer } from 'three/addons/misc/Timer.js';
import {OrbitControls}   from 'three/addons/controls/OrbitControls.js';
import {EffectComposer}  from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass}      from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';

const MENU=220,cW=()=>window.innerWidth-MENU,cH=()=>window.innerHeight;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x02020f);
scene.fog=new THREE.FogExp2(0x02020f,.010);

const camera=new THREE.PerspectiveCamera(60,cW()/cH(),.1,300);
camera.position.set(2.5,1.0,24);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(cW(),cH());
document.getElementById('canvas-wrap').insertBefore(renderer.domElement,document.getElementById('lc'));

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.08;
controls.autoRotate=true;controls.autoRotateSpeed=.18;
controls.target.set(2.5,1.0,0);

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(cW(),cH()),.85,.45,.12);
composer.addPass(bloom);

scene.add(new THREE.AmbientLight(0xffffff,.35));
const dirL=new THREE.DirectionalLight(0xffffff,.6);
dirL.position.set(5,12,8);scene.add(dirL);

// ── Nodes ─────────────────────────────────────────────────────────────────────
// Layout verified against live DOM label positions (1220x900 canvas, z=32).
// Each node's projected screen position confirmed to avoid label overlap.
//
//  y=+13  clientcache(9,13)                              obs(21,13)   → screen ~12% from top
//  y=+6               telecomcache(9,6)  gwmicro(15,6)  telecomapi(21,6) → 35%
//  y=+3                              aserver1(3,3)                        → 44%
//  y=-1  client(-16,-1)  apigw(-10,-1)  lb(-4,-1)                        → 56%
//  y=-4                              aserver2(3,-4)                       → 65%
//  y=-9  digcat(0,-9)                                                      → 79%
//         threadpool(10,-8)   es(16,-6)   cron(16,-11)                    → 77-87%
const NODES={
  client:      {p:[-14.0,-1.0, 3.0], c:0x3d7fff, label:'CLIENT',               sub:'iOS · Android · Web',                        type:'client'   },
  apigw:       {p:[ -8.0,-1.0, 2.5], c:0x00c0ff, label:'API GATEWAY',          sub:'Auth · Rate Limit · Service-specific Limit', type:'gateway'  },
  lb:          {p:[ -2.0,-1.0, 0.0], c:0x00ddcc, label:'LOAD BALANCER',        sub:'App Server Traffic Distribution',            type:'lb'       },
  aserver1:    {p:[  4.0, 3.0, 1.5], c:0x22ee77, label:'APP SERVER 1',         sub:'Plan Merge · Resilience4j CB',               type:'server'   },
  aserver2:    {p:[  4.0,-4.0, 0.5], c:0x22ee77, label:'APP SERVER 2',         sub:'Plan Merge · Resilience4j CB',               type:'server'   },
  clientcache: {p:[  9.0,13.0, 1.0], c:0xff7722, label:'CLIENT RESPONSE CACHE',sub:'Aerospike · 15-min TTL · key: params+body',  type:'cache'    },
  telecomcache:{p:[  9.0, 8.0, 0.5], c:0xff9944, label:'TELECOM API CACHE',    sub:'Aerospike · 30-min TTL · key: uid+op+num',   type:'cache'    },
  gwmicro:     {p:[ 15.5, 5.0,-1.0], c:0xff5577, label:'GATEWAY MICROSERVICE', sub:'External Team · Telecom API Proxy',          type:'gateway'  },
  telecomapi:  {p:[ 21.5, 3.0,-2.0], c:0xffaa00, label:'TELECOM OPERATOR API', sub:'External · Real-time Dynamic Plans',         type:'client'   },
  digcat:      {p:[  1.0,-9.0,-1.5], c:0x4488ff, label:'DIGITAL CATALOG SVC',  sub:'Project 1 · Static Plans & Search',          type:'server'   },
  threadpool:  {p:[ 10.0,-8.0, 0.0], c:0x77ee33, label:'THREAD POOL EXECUTOR', sub:'Core 50 · Max 200 · Queue 1,000 · 3× Retry', type:'processor'},
  es:          {p:[ 16.0,-6.0,-0.5], c:0x3366ff, label:'ELASTICSEARCH',        sub:'Dynamic Plan Index · 3-day TTL',             type:'es'       },
  cron:        {p:[ 16.0,-11.0, 0.5], c:0xffcc00, label:'CRON JOB',           sub:'Deletes ES Indexes Older Than 3 Days',        type:'processor'},
  obs:         {p:[ 21.5,13.0, 1.5], c:0x55eebb, label:'OBSERVABILITY',        sub:'Prometheus · Grafana · Datadog · PagerDuty', type:'obs'      },
};

function stdMat(c){return new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:.22,roughness:.55,metalness:.35,transparent:true,opacity:0});}
function nodeGeo(t){
  switch(t){
    case'client':   return new THREE.SphereGeometry(.52,32,24);
    case'gateway':  return new THREE.OctahedronGeometry(.52,0);
    case'lb':       return new THREE.CylinderGeometry(.38,.48,.72,6);
    case'server':   return new THREE.BoxGeometry(.82,.82,.82);
    case'processor':return new THREE.BoxGeometry(.78,.62,.78);
    case'cache':    return new THREE.CylinderGeometry(.46,.46,.88,16);
    case'es':       return new THREE.TorusGeometry(.42,.18,12,24);
    case'obs':      return new THREE.IcosahedronGeometry(.5,0);
    default:        return new THREE.SphereGeometry(.48,16,12);
  }
}

const nodeObjs={},nodeLights={},labelDivs={};
const lc=document.getElementById('lc');
for(const[id,nd]of Object.entries(NODES)){
  const m=new THREE.Mesh(nodeGeo(nd.type),stdMat(nd.c));
  m.position.set(...nd.p);scene.add(m);nodeObjs[id]=m;
  const pl=new THREE.PointLight(nd.c,0,7.0);
  pl.position.set(...nd.p);scene.add(pl);nodeLights[id]=pl;
  const d=document.createElement('div');
  d.className='lbl';d.style.display='none';
  d.innerHTML=`<div class="lbl-main">${nd.label}</div><div class="lbl-sub">${nd.sub}</div>`;
  lc.appendChild(d);labelDivs[id]=d;
}

// ── Dust ──────────────────────────────────────────────────────────────────────
const DUST_N=32,DUST_DUR=.7,dustSys={};
for(const[id,nd]of Object.entries(NODES)){
  const pos=new Float32Array(DUST_N*3);
  for(let i=0;i<DUST_N;i++){pos[i*3]=nd.p[0];pos[i*3+1]=nd.p[1];pos[i*3+2]=nd.p[2];}
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const mat=new THREE.PointsMaterial({color:nd.c,size:.09,transparent:true,opacity:0,sizeAttenuation:true,depthWrite:false});
  const pts=new THREE.Points(geo,mat);scene.add(pts);
  const dirs=Array.from({length:DUST_N},()=>new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5).normalize());
  dustSys[id]={pts,geo,mat,dirs,phase:'idle',t:0};
}

// ── Connections ───────────────────────────────────────────────────────────────
const PL='plan-listing',PS='plan-search',EL='es-lifecycle';
const CDEFS=[
  // entry path
  {a:'client',   b:'apigw',       c:0x3d7fff,flows:[PL,PS]},
  {a:'apigw',    b:'lb',          c:0x00c0ff,flows:[PL,PS]},
  {a:'lb',       b:'aserver1',    c:0x00ddcc,flows:[PL,PS]},
  {a:'lb',       b:'aserver2',    c:0x00ddcc,flows:[PL,PS]},
  // plan-listing caches + external
  {a:'aserver1', b:'clientcache', c:0xff7722,flows:[PL]},
  {a:'aserver2', b:'clientcache', c:0xff7722,flows:[PL]},
  {a:'aserver1', b:'telecomcache',c:0xff9944,flows:[PL]},
  {a:'aserver2', b:'telecomcache',c:0xff9944,flows:[PL]},
  {a:'aserver1', b:'digcat',      c:0x4488ff,flows:[PL,PS]},
  {a:'aserver2', b:'digcat',      c:0x4488ff,flows:[PL,PS]},
  {a:'aserver1', b:'gwmicro',     c:0xff5577,flows:[PL]},
  {a:'aserver2', b:'gwmicro',     c:0xff5577,flows:[PL]},
  {a:'gwmicro',  b:'telecomapi',  c:0xffaa00,flows:[PL]},
  {a:'aserver1', b:'threadpool',  c:0x77ee33,flows:[PL]},
  {a:'threadpool',b:'es',         c:0x77ee33,flows:[PL]},
  // plan-search direct ES
  {a:'aserver1', b:'es',          c:0x3366ff,flows:[PS]},
  {a:'aserver2', b:'es',          c:0x3366ff,flows:[PS]},
  // es-lifecycle
  {a:'cron',     b:'es',          c:0xffcc00,flows:[EL]},
  // obs — each line follows its endpoint's flows
  {a:'obs',b:'aserver1',  c:0x55eebb,flows:[PL,PS],obs:true},
  {a:'obs',b:'aserver2',  c:0x55eebb,flows:[PL,PS],obs:true},
  {a:'obs',b:'es',        c:0x55eebb,flows:[PL,PS],obs:true},
  {a:'obs',b:'threadpool',c:0x55eebb,flows:[PL],obs:true},
  {a:'obs',b:'gwmicro',   c:0x55eebb,flows:[PL],obs:true},
  {a:'obs',b:'digcat',    c:0x55eebb,flows:[PL,PS],obs:true},
];
const connLines=[];
for(const cd of CDEFS){
  const pa=new THREE.Vector3(...NODES[cd.a].p),pb=new THREE.Vector3(...NODES[cd.b].p);
  const mat=new THREE.LineBasicMaterial({color:cd.c,transparent:true,opacity:0});
  const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints([pa,pb]),mat);
  scene.add(line);
  connLines.push({line,flows:cd.flows,obs:!!cd.obs,phase:'idle',t:0});
}

// ── Curves ────────────────────────────────────────────────────────────────────
const CV={};
function mkC(a,b,key,bend=[0,0,0]){
  const pa=new THREE.Vector3(...NODES[a].p),pb=new THREE.Vector3(...NODES[b].p);
  CV[key]=new THREE.CatmullRomCurve3([pa,pa.clone().add(pb).multiplyScalar(.5).add(new THREE.Vector3(...bend)),pb]);
}
// entry row y=-1: horizontal left→right (client shifted to x=-14)
mkC('client',   'apigw',       'c>gw',   [ 0,   .4,  .3]);
mkC('apigw',    'lb',          'gw>lb',  [ 0,   .3,  .4]);
// lb(-2,-1) fans UP to as1(4,3) and DOWN to as2(4,-4)
mkC('lb',       'aserver1',    'lb>as1', [ 0,  1.2,  .8]);
mkC('lb',       'aserver2',    'lb>as2', [ 0,  -.5,  .3]);
// as1→clientcache: long upward arc (y=3 → y=13)
mkC('aserver1', 'clientcache', 'as1>cc', [ 0,  1.5,  .3]);
// as2→clientcache: very long upward arc (y=-4 → y=13)
mkC('aserver2', 'clientcache', 'as2>cc', [ 0,  3.8,  .5]);
// telecom chain: staggered y — telecomcache(y=8) → gwmicro(y=5) → telecomapi(y=3)
// this separates labels vertically: ~88px y-gap between each pair
mkC('aserver1', 'telecomcache','as1>tc', [ 0,   .8, -.2]); // slight upward (y=3→y=8)
mkC('aserver2', 'telecomcache','as2>tc', [ 0,  2.2,  .3]); // long upward
mkC('aserver1', 'gwmicro',     'as1>gw', [ 0,   .3, -.5]); // slight upward-right
mkC('aserver2', 'gwmicro',     'as2>gw', [ 0,  1.8, -.4]); // upward arc
mkC('gwmicro',  'telecomapi',  'gw>to',  [ 0,  -.5, -.4]); // diagonal down-right
// digcat now at x=1; bow curves apart
mkC('aserver1', 'digcat',      'as1>dc', [-2.0,-1.0, -.5]); // bows left
mkC('aserver2', 'digcat',      'as2>dc', [ 2.0, -.4, -.4]); // bows right
// async write: as1 drops far to threadpool(10,-8), then right to es(16,-6)
mkC('aserver1', 'threadpool',  'as1>tp', [ 0,  -2.5, -.5]);
mkC('threadpool','es',         'tp>es',  [ 0,   .8,  .3]);
// plan-search direct ES: bow apart
mkC('aserver1', 'es',          'as1>es', [-1.5,-2.0, -.5]);
mkC('aserver2', 'es',          'as2>es', [ 1.5, -.5, -.4]);
// cron→es: same x column, bow right
mkC('cron',     'es',          'cron>es',[ 2.5,  .4,  .3]);

// ── Flow node sets ────────────────────────────────────────────────────────────
const FN={
  [PL]:new Set(['client','apigw','lb','aserver1','aserver2','clientcache','telecomcache','digcat','gwmicro','telecomapi','threadpool','es','obs']),
  [PS]:new Set(['client','apigw','lb','aserver1','aserver2','digcat','es','obs']),
  [EL]:new Set(['cron','es']),
};
const FC={[PL]:38,[PS]:12,[EL]:8};

// Per-flow camera positions — each flow gets a camera tailored to its node spread
const FLOW_CAM={
  [PL]:{pos:new THREE.Vector3(2.5, 1.0,24), tgt:new THREE.Vector3(2.5, 1.0,0)},
  [PS]:{pos:new THREE.Vector3(2.5, 1.0,24), tgt:new THREE.Vector3(2.5, 1.0,0)},
  [EL]:{pos:new THREE.Vector3(16.0,-8.5,14), tgt:new THREE.Vector3(16.0,-8.5,0)},
};
let camTransition=null;

// ── Packets ───────────────────────────────────────────────────────────────────
const PD=[

  // ════════════════════════════════════════════════════════════════════════════
  // PLAN LISTING  (CYCLE = 38s)
  // ════════════════════════════════════════════════════════════════════════════

  // ── Phase 1 — Client Response Cache HIT  (0–4s) ───────────────────────────
  {cv:'c>gw',   col:0x66aaff,flow:PL,delay:0,    dur:.65},
  {cv:'gw>lb',  col:0x66aaff,flow:PL,delay:.6,   dur:.60},
  {cv:'lb>as1', col:0x66aaff,flow:PL,delay:1.1,  dur:.60},
  {cv:'as1>cc', col:0xffaa44,flow:PL,delay:1.65, dur:.55},          // check client cache
  {cv:'as1>cc', col:0x44ff99,flow:PL,delay:2.1,  dur:.50,rev:true}, // HIT → respond instantly
  {cv:'lb>as1', col:0x88ccff,flow:PL,delay:2.5,  dur:.50,rev:true},
  {cv:'gw>lb',  col:0x88ccff,flow:PL,delay:2.9,  dur:.50,rev:true},
  {cv:'c>gw',   col:0x88ccff,flow:PL,delay:3.3,  dur:.50,rev:true},

  // ── Phase 2 — Telecom API Cache HIT  (7–13.5s) ───────────────────────────
  {cv:'c>gw',   col:0xaa66ff,flow:PL,delay:7.0,  dur:.65},
  {cv:'gw>lb',  col:0xaa66ff,flow:PL,delay:7.6,  dur:.60},
  {cv:'lb>as2', col:0xaa66ff,flow:PL,delay:8.1,  dur:.60},
  {cv:'as2>cc', col:0xffaa44,flow:PL,delay:8.65, dur:.55},          // check client cache
  {cv:'as2>cc', col:0xff2200,flow:PL,delay:9.1,  dur:.40,rev:true}, // MISS (red)
  // parallel: static plans + telecom cache check
  {cv:'as2>dc', col:0x4488ff,flow:PL,delay:9.45, dur:.80},
  {cv:'as2>tc', col:0xffaa44,flow:PL,delay:9.45, dur:.55},          // check telecom cache
  {cv:'as2>tc', col:0x44ff99,flow:PL,delay:9.9,  dur:.50,rev:true}, // HIT → cached response
  {cv:'as2>dc', col:0x88aaff,flow:PL,delay:10.2, dur:.60,rev:true}, // static plans back
  {cv:'as2>cc', col:0xff9944,flow:PL,delay:10.75,dur:.50},          // write merged to client cache
  {cv:'lb>as2', col:0xcc88ff,flow:PL,delay:11.2, dur:.55,rev:true},
  {cv:'gw>lb',  col:0xcc88ff,flow:PL,delay:11.65,dur:.50,rev:true},
  {cv:'c>gw',   col:0xcc88ff,flow:PL,delay:12.05,dur:.50,rev:true},

  // ── Phase 3 — Full Miss → Telecom API call → SUCCESS  (17–26s) ───────────
  {cv:'c>gw',   col:0x44ddff,flow:PL,delay:17.0, dur:.65},
  {cv:'gw>lb',  col:0x44ddff,flow:PL,delay:17.6, dur:.60},
  {cv:'lb>as1', col:0x44ddff,flow:PL,delay:18.1, dur:.60},
  {cv:'as1>cc', col:0xffaa44,flow:PL,delay:18.65,dur:.55},          // check client cache
  {cv:'as1>cc', col:0xff2200,flow:PL,delay:19.1, dur:.40,rev:true}, // MISS
  // parallel: digcat fetch + telecom cache check
  {cv:'as1>dc', col:0x4488ff,flow:PL,delay:19.45,dur:.85},          // static plans (parallel)
  {cv:'as1>tc', col:0xffaa44,flow:PL,delay:19.45,dur:.55},          // check telecom cache
  {cv:'as1>tc', col:0xff2200,flow:PL,delay:19.9, dur:.40,rev:true}, // MISS → must call telecom API
  // call gateway microservice → telecom operator API
  {cv:'as1>gw', col:0xff7755,flow:PL,delay:20.25,dur:.90},
  {cv:'gw>to',  col:0xffaa00,flow:PL,delay:21.05,dur:.85},          // gateway → telecom
  {cv:'gw>to',  col:0xffdd55,flow:PL,delay:21.8, dur:.80,rev:true}, // telecom response
  {cv:'as1>gw', col:0xffbb44,flow:PL,delay:22.5, dur:.70,rev:true}, // gateway → app server
  // static plans arrive from digcat (was running in parallel)
  {cv:'as1>dc', col:0x88aaff,flow:PL,delay:20.3, dur:.65,rev:true},
  // cache telecom response (30-min) + async ES write via thread pool
  {cv:'as1>tc', col:0xff8822,flow:PL,delay:23.1, dur:.50},          // write telecom cache
  {cv:'as1>tp', col:0x77ee33,flow:PL,delay:23.5, dur:.65},          // async to thread pool
  {cv:'tp>es',  col:0x77ee33,flow:PL,delay:24.05,dur:.80},          // thread pool → ES index
  // write merged response to client cache + return to client
  {cv:'as1>cc', col:0xff9944,flow:PL,delay:23.5, dur:.55},          // write client cache (15-min)
  {cv:'lb>as1', col:0x66ddff,flow:PL,delay:24.0, dur:.55,rev:true},
  {cv:'gw>lb',  col:0x66ddff,flow:PL,delay:24.45,dur:.50,rev:true},
  {cv:'c>gw',   col:0x66ddff,flow:PL,delay:24.85,dur:.50,rev:true},

  // ── Phase 4 — Circuit Breaker OPEN → fallback to static plans  (30–36s) ──
  {cv:'c>gw',   col:0xff8888,flow:PL,delay:30.0, dur:.65},
  {cv:'gw>lb',  col:0xff8888,flow:PL,delay:30.55,dur:.60},
  {cv:'lb>as2', col:0xff8888,flow:PL,delay:31.05,dur:.60},
  {cv:'as2>cc', col:0xffaa44,flow:PL,delay:31.6, dur:.55},          // check client cache
  {cv:'as2>cc', col:0xff2200,flow:PL,delay:32.05,dur:.40,rev:true}, // MISS
  {cv:'as2>tc', col:0xffaa44,flow:PL,delay:32.4, dur:.55},          // check telecom cache
  {cv:'as2>tc', col:0xff2200,flow:PL,delay:32.85,dur:.40,rev:true}, // MISS
  {cv:'as2>gw', col:0xff4400,flow:PL,delay:33.2, dur:.70},          // → gateway (circuit open)
  {cv:'as2>gw', col:0xff0000,flow:PL,delay:33.8, dur:.45,rev:true}, // CIRCUIT OPEN — instant bounce
  // fallback: use static plans only from digital catalog
  {cv:'as2>dc', col:0x4488ff,flow:PL,delay:34.1, dur:.80},
  {cv:'as2>dc', col:0x88aaff,flow:PL,delay:34.8, dur:.65,rev:true},
  {cv:'as2>cc', col:0xff9944,flow:PL,delay:35.35,dur:.50},          // write static-only to client cache
  {cv:'lb>as2', col:0xffaaaa,flow:PL,delay:35.75,dur:.50,rev:true},
  {cv:'gw>lb',  col:0xffaaaa,flow:PL,delay:36.15,dur:.50,rev:true},
  {cv:'c>gw',   col:0xffaaaa,flow:PL,delay:36.55,dur:.50,rev:true},

  // ════════════════════════════════════════════════════════════════════════════
  // PLAN SEARCH  (CYCLE = 12s) — CompletableFuture parallel fetch
  // ════════════════════════════════════════════════════════════════════════════

  // Request 1 via aserver1
  {cv:'c>gw',   col:0x88ff55,flow:PS,delay:0,   dur:.65},
  {cv:'gw>lb',  col:0x88ff55,flow:PS,delay:.6,  dur:.60},
  {cv:'lb>as1', col:0x88ff55,flow:PS,delay:1.1, dur:.60},
  // parallel: ES (dynamic) + digcat (static)
  {cv:'as1>es', col:0x5577ff,flow:PS,delay:1.65,dur:.85},
  {cv:'as1>dc', col:0x4488ff,flow:PS,delay:1.65,dur:.80},
  {cv:'as1>es', col:0x88aaff,flow:PS,delay:2.45,dur:.70,rev:true},
  {cv:'as1>dc', col:0x88aaff,flow:PS,delay:2.4, dur:.65,rev:true},
  {cv:'lb>as1', col:0xaaffaa,flow:PS,delay:3.05,dur:.55,rev:true},
  {cv:'gw>lb',  col:0xaaffaa,flow:PS,delay:3.5, dur:.50,rev:true},
  {cv:'c>gw',   col:0xaaffaa,flow:PS,delay:3.9, dur:.50,rev:true},

  // Request 2 via aserver2
  {cv:'c>gw',   col:0x55ffaa,flow:PS,delay:7.0, dur:.65},
  {cv:'gw>lb',  col:0x55ffaa,flow:PS,delay:7.6, dur:.60},
  {cv:'lb>as2', col:0x55ffaa,flow:PS,delay:8.1, dur:.60},
  {cv:'as2>es', col:0x5577ff,flow:PS,delay:8.65,dur:.85},
  {cv:'as2>dc', col:0x4488ff,flow:PS,delay:8.65,dur:.80},
  {cv:'as2>es', col:0x88aaff,flow:PS,delay:9.45,dur:.70,rev:true},
  {cv:'as2>dc', col:0x88aaff,flow:PS,delay:9.4, dur:.65,rev:true},
  {cv:'lb>as2', col:0xaaffaa,flow:PS,delay:10.05,dur:.55,rev:true},
  {cv:'gw>lb',  col:0xaaffaa,flow:PS,delay:10.5,dur:.50,rev:true},
  {cv:'c>gw',   col:0xaaffaa,flow:PS,delay:10.9,dur:.50,rev:true},

  // ════════════════════════════════════════════════════════════════════════════
  // ES INDEX LIFECYCLE  (CYCLE = 8s)
  // ════════════════════════════════════════════════════════════════════════════

  {cv:'cron>es',col:0xffcc00,flow:EL,delay:0,   dur:.80},          // read index created_time
  {cv:'cron>es',col:0xffee88,flow:EL,delay:.7,  dur:.65,rev:true}, // metadata returned
  {cv:'cron>es',col:0xff4400,flow:EL,delay:2.0, dur:.75},          // delete stale index 1
  {cv:'cron>es',col:0xff8844,flow:EL,delay:2.65,dur:.55,rev:true},
  {cv:'cron>es',col:0xff4400,flow:EL,delay:4.0, dur:.75},          // delete stale index 2
  {cv:'cron>es',col:0xff8844,flow:EL,delay:4.65,dur:.55,rev:true},
  {cv:'cron>es',col:0xff4400,flow:EL,delay:6.0, dur:.75},          // delete stale index 3
  {cv:'cron>es',col:0xff8844,flow:EL,delay:6.65,dur:.55,rev:true},
];

const TS=.055,TN=4,packets=[];
for(const pd of PD){
  const h=new THREE.Mesh(new THREE.SphereGeometry(.13,10,8),new THREE.MeshBasicMaterial({color:pd.col}));
  h.visible=false;scene.add(h);
  const tr=[];
  for(let i=1;i<=TN;i++){
    const s=new THREE.Mesh(new THREE.SphereGeometry(.13*(1-i*.18),10,8),
      new THREE.MeshBasicMaterial({color:pd.col,transparent:true,opacity:1-i*.2}));
    s.visible=false;scene.add(s);tr.push(s);
  }
  packets.push({...pd,h,tr});
}

// ── Flow state ────────────────────────────────────────────────────────────────
let activeFlow=PL,cycleT=0;

function triggerTransitions(prev,next){
  for(const id of Object.keys(NODES)){
    const was=FN[prev].has(id),now=FN[next].has(id),d=dustSys[id];
    if(was&&!now){d.phase='dissolve';d.t=0;}
    else if(!was&&now){d.phase='form';d.t=0;}
  }
  for(const cl of connLines){
    const was=cl.flows.includes(prev),will=cl.flows.includes(next);
    if(was&&!will){cl.phase='dissolve';cl.t=0;}
    else if(!was&&will){cl.phase='form';cl.t=0;}
  }
}
function setFlow(id){
  if(id===activeFlow)return;
  triggerTransitions(activeFlow,id);
  activeFlow=id;cycleT=0;
  document.querySelectorAll('.flow-btn').forEach(el=>el.classList.toggle('active',el.dataset.flow===id));
  const fc=FLOW_CAM[id];
  camTransition={fromPos:camera.position.clone(),fromTgt:controls.target.clone(),
    toPos:fc.pos.clone(),toTgt:fc.tgt.clone(),t:0,dur:1.2};
}
document.querySelectorAll('.flow-btn').forEach(btn=>btn.addEventListener('click',()=>setFlow(btn.dataset.flow)));

setTimeout(()=>{
  [...FN[PL]].forEach((id,i)=>setTimeout(()=>{dustSys[id].phase='form';dustSys[id].t=0;},i*100));
  connLines.forEach(cl=>{if(cl.flows.includes(PL)){cl.phase='form';cl.t=0;}});
},250);

// ── Animate — capped to 60fps so autoRotate speed is frame-rate independent ──
const clock=new Timer(),tv=new THREE.Vector3();
const TARGET_MS=1000/60;let accumMs=0;
function animate(){
  requestAnimationFrame(animate);
  clock.update();
  const rawDt=clock.getDelta();
  accumMs+=rawDt*1000;
  if(accumMs<TARGET_MS)return;      // skip frame — not yet time
  const dt=Math.min(accumMs/1000,.05);
  accumMs=0;
  cycleT=(cycleT+dt)%FC[activeFlow];
  if(camTransition){
    camTransition.t=Math.min(camTransition.t+dt,camTransition.dur);
    const tt=camTransition.t/camTransition.dur;
    const ease=tt<.5?2*tt*tt:-1+(4-2*tt)*tt; // smoothstep
    camera.position.lerpVectors(camTransition.fromPos,camTransition.toPos,ease);
    controls.target.lerpVectors(camTransition.fromTgt,camTransition.toTgt,ease);
    camera.lookAt(controls.target);
    if(camTransition.t>=camTransition.dur){camTransition=null;}
  }else{
    controls.update();
  }

  for(const[id,d]of Object.entries(dustSys)){
    const nd=NODES[id],m=nodeObjs[id],on=FN[activeFlow].has(id);
    const pos=d.geo.attributes.position.array;
    if(d.phase==='idle'){m.material.opacity=on?1:0;nodeLights[id].intensity=on?1.2:0;d.mat.opacity=0;continue;}
    d.t=Math.min(d.t+dt,DUST_DUR);
    const t=d.t/DUST_DUR;
    if(d.phase==='dissolve'){
      m.material.opacity=1-t;nodeLights[id].intensity=(1-t)*1.2;
      d.mat.opacity=Math.sin(t*Math.PI)*.9;
      const sp=t*t*3;
      for(let i=0;i<DUST_N;i++){pos[i*3]=nd.p[0]+d.dirs[i].x*sp;pos[i*3+1]=nd.p[1]+d.dirs[i].y*sp;pos[i*3+2]=nd.p[2]+d.dirs[i].z*sp;}
      if(d.t>=DUST_DUR){d.phase='idle';m.material.opacity=0;nodeLights[id].intensity=0;d.mat.opacity=0;}
    }else{
      m.material.opacity=t>.45?(t-.45)/.55:0;nodeLights[id].intensity=m.material.opacity*1.2;
      d.mat.opacity=(1-t)*.9;
      const sp=(1-t)*(1-t)*3;
      for(let i=0;i<DUST_N;i++){pos[i*3]=nd.p[0]+d.dirs[i].x*sp;pos[i*3+1]=nd.p[1]+d.dirs[i].y*sp;pos[i*3+2]=nd.p[2]+d.dirs[i].z*sp;}
      if(d.t>=DUST_DUR){d.phase='idle';m.material.opacity=1;nodeLights[id].intensity=1.2;d.mat.opacity=0;}
    }
    d.geo.attributes.position.needsUpdate=true;
  }

  for(const cl of connLines){
    const active=cl.flows.includes(activeFlow),maxOp=cl.obs?.18:.55;
    if(cl.phase==='idle'){cl.line.material.opacity=active?maxOp:0;continue;}
    cl.t=Math.min(cl.t+dt,DUST_DUR);
    const t=cl.t/DUST_DUR;
    if(cl.phase==='dissolve'){
      cl.line.material.opacity=(1-t)*maxOp;
      if(cl.t>=DUST_DUR){cl.phase='idle';cl.line.material.opacity=0;}
    }else{
      cl.line.material.opacity=t*maxOp;
      if(cl.t>=DUST_DUR){cl.phase='idle';cl.line.material.opacity=maxOp;}
    }
  }

  const CYCLE=FC[activeFlow];
  for(const pk of packets){
    if(pk.flow!==activeFlow){pk.h.visible=false;pk.tr.forEach(s=>s.visible=false);continue;}
    const local=((cycleT-pk.delay)%CYCLE+CYCLE)%CYCLE;
    if(local<pk.dur){
      const t=local/pk.dur,crv=CV[pk.cv];
      if(!crv){pk.h.visible=false;pk.tr.forEach(s=>s.visible=false);continue;}
      const tPos=pk.rev?(1-t):t;
      crv.getPoint(tPos,pk.h.position);pk.h.visible=true;
      pk.tr.forEach((s,i)=>{
        const tt=pk.rev?Math.min(1,tPos+(i+1)*TS):Math.max(0,tPos-(i+1)*TS);
        crv.getPoint(tt,s.position);s.visible=true;
      });
    }else{pk.h.visible=false;pk.tr.forEach(s=>s.visible=false);}
  }

  const W2=cW()/2,H2=cH()/2;
  for(const[id,m]of Object.entries(nodeObjs)){
    if(m.material.opacity<.05){labelDivs[id].style.display='none';continue;}
    tv.copy(m.position);tv.project(camera);
    const d=labelDivs[id];
    d.style.left=(tv.x*W2+W2)+'px';d.style.top=(-(tv.y*H2)+H2+18)+'px';
    d.style.display=tv.z<1?'block':'none';d.style.opacity=m.material.opacity;
  }
  composer.render();
}
animate();

window.addEventListener('resize',()=>{
  const W=cW(),H=cH();
  camera.aspect=W/H;camera.updateProjectionMatrix();
  renderer.setSize(W,H);composer.setSize(W,H);bloom.resolution.set(W,H);
});
</script>
</body>
